<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Golf 7.5 CZCA — карта машины</title>
<style>
  :root{
    --bg:#141619;
    --bg-panel:#1b1e23;
    --bg-soft:#20242a;
    --line:#2b3038;
    --line-soft:#242830;
    --text:#e9e7e0;
    --dim:#868b93;
    --dimmer:#5a5f67;
    --amber:#e8a33d;
    --teal:#4fb0a5;
    --blue:#6ea8d8;
    --violet:#b391d9;
    --coral:#e2735c;
    --mono:'SF Mono','JetBrains Mono',Consolas,monospace;
    --sans:-apple-system,'Inter','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
  .app{display:flex;flex-direction:column;height:100%}

  header{
    border-bottom:1px solid var(--line);padding:12px 18px;flex:none;
    display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
  }
  .brand .eyebrow{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--amber);margin-bottom:4px;
  }
  .brand h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
  .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .search-wrap{position:relative}
  #search{
    font-family:var(--mono);font-size:12px;background:var(--bg-panel);
    border:1px solid var(--line);color:var(--text);padding:7px 12px;border-radius:18px;
    width:230px;outline:none
  }
  #search:focus{border-color:var(--amber)}
  #search::placeholder{color:var(--dimmer)}
  .results{
    position:absolute;top:34px;left:0;width:300px;background:var(--bg-panel);
    border:1px solid var(--line);border-radius:10px;max-height:300px;overflow-y:auto;
    z-index:60;display:none
  }
  .results.show{display:block}
  .ritem{padding:8px 11px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;gap:8px}
  .ritem:last-child{border-bottom:none}
  .ritem:hover{background:rgba(232,163,61,.09)}
  .ritem .rd{color:var(--dim);font-family:var(--mono);font-size:10px;white-space:nowrap}
  .btn{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;background:var(--bg-panel);
    border:1px solid var(--line);color:var(--dim);padding:7px 11px;border-radius:18px;cursor:pointer;transition:.15s
  }
  .btn:hover{border-color:var(--amber);color:var(--text)}

  main{flex:1;display:flex;min-height:0;position:relative}
  #panelHandle{
    position:absolute;top:50%;right:470px;transform:translate(50%,-50%);
    z-index:40;padding:10px 6px;border-radius:6px;
    transition:right .22s ease;font-size:13px;line-height:1
  }
  #colSide.collapsed ~ #panelHandle{right:0}
  .col-graph{flex:1;min-width:0;position:relative;border-right:1px solid var(--line)}
  .col-side{width:470px;flex:none;display:flex;flex-direction:column;min-height:0;
            transition:width .22s ease;overflow:hidden}
  .col-side.collapsed{width:0;border-left:none}
  .detail{flex:1;overflow-y:auto;padding:16px 18px 30px;min-height:0}
  .detail .ptype{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:5px}
  .detail h2{font-size:18px;margin:0 0 13px;line-height:1.32;white-space:pre-line}
  .field{margin-bottom:11px}
  .field .k{font-family:var(--mono);font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
  .field .v{font-size:13.5px;line-height:1.5}
  .chips{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .chips .lt{font-family:var(--mono);font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
    .chip{text-decoration:none;
    display:inline-block;font-family:var(--mono);font-size:11px;color:var(--text);
    background:var(--bg-soft);border:1px solid var(--line);border-radius:13px;
    padding:4px 10px;margin:0 5px 5px 0;cursor:pointer
  }
  .chip:hover{border-color:var(--amber)}
  a.chip{color:var(--text)}
  .empty{color:var(--dim);font-size:13.5px;line-height:1.6}

  .crumbs{font-family:var(--mono);font-size:11px;color:var(--dimmer);margin-bottom:8px;line-height:1.7}
  .crumb{color:var(--dim);cursor:pointer}
  .crumb:hover{color:var(--amber)}
  .crumb.here{color:var(--text)}
  .crumb-sep{opacity:.5;margin:0 4px}

  .navsec{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
  .navsec .lt{
    font-family:var(--mono);font-size:10.5px;color:var(--dim);text-transform:uppercase;
    letter-spacing:.05em;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center
  }
  .navsec .lt .tg{cursor:pointer;color:var(--dimmer);border:1px solid var(--line);border-radius:10px;padding:2px 8px}
  .navsec .lt .tg:hover{color:var(--amber);border-color:var(--amber)}
  .navlist{display:flex;flex-direction:column;gap:1px;max-height:400px;overflow-y:auto;margin:0 -6px}
  .navrow{
    display:flex;align-items:baseline;gap:8px;padding:6px 8px;border-radius:5px;cursor:pointer;
    border-left:2px solid transparent
  }
  .navrow:hover{background:var(--bg-soft);border-left-color:var(--amber)}
  .navrow .nm{font-size:13.5px;color:var(--text);flex:none;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .navrow .ns{font-size:12px;color:var(--dim);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .navrow .nk{font-family:var(--mono);font-size:10px;color:var(--dimmer);flex:none}
  .navrow.up{border-left-color:var(--line);color:var(--dim)}
  .navrow.up .nm{color:var(--dim);font-family:var(--mono);font-size:11.5px;max-width:none}
  .navrow.leaf{cursor:pointer}
  .navdot{width:6px;height:6px;border-radius:2px;flex:none;align-self:center}

  #prfilter{
    width:100%;font-family:var(--mono);font-size:12px;background:var(--bg-soft);
    border:1px solid var(--line);color:var(--text);padding:7px 11px;border-radius:16px;
    outline:none;margin-bottom:10px
  }
  #prfilter:focus{border-color:var(--amber)}
  #prfilter::placeholder{color:var(--dimmer)}
  .prgroup{
    font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--violet);margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)
  }
  .prrow{display:flex;gap:9px;padding:4px 2px;align-items:baseline}
  .prrow:hover{background:var(--bg-soft);border-radius:4px}
  .prrow .pc{font-family:var(--mono);font-size:11.5px;color:var(--amber);flex:none;width:42px}
  .prrow .pv{font-size:12.5px;color:var(--text);line-height:1.4}
  .prrow .pp{font-size:11px;color:var(--dim);display:block}
  .prcount{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-bottom:6px}

  #gsvg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #gsvg:active{cursor:grabbing}
  .lyr{pointer-events:none}
  #gsvg{shape-rendering:optimizeSpeed}
  .gnode text{shape-rendering:auto}
  .glink{fill:none;stroke:var(--line);stroke-width:1.3}
  .gframe{fill:rgba(255,255,255,.014);stroke:var(--line);stroke-width:1;stroke-dasharray:3,4}
  .xlink{fill:none;stroke:var(--coral);stroke-width:1.2;stroke-dasharray:3,3;opacity:.14}
  .xlink.on{opacity:.95;stroke-width:1.8}
  .gnode{cursor:pointer}
  .gnode.draggable{cursor:grab}
  .gnode.draggable:active{cursor:grabbing}
  .gnode rect{stroke-width:1.2}
  .gnode text{font-family:var(--mono);pointer-events:none;user-select:none}
  .faded{opacity:.38}
  .gnode.sel rect{stroke-width:2.4;stroke:#fff}

  .legend{
    position:absolute;left:14px;bottom:14px;z-index:20;background:rgba(27,30,35,.93);
    border:1px solid var(--line);border-radius:9px;padding:9px 12px;
    font-family:var(--mono);font-size:10px;color:var(--dim);display:flex;flex-direction:column;gap:4px
  }
  .legend .row{display:flex;align-items:center;gap:7px}
  .legend .sw{width:9px;height:9px;border-radius:2px;flex:none}
  .legend .dash{width:15px;height:0;border-top:2px dashed var(--coral)}
  .zoombar{position:absolute;right:14px;bottom:14px;z-index:20;display:flex;gap:6px}


  @media(max-width:1100px){
    main{flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
    .col-graph{height:52vh;flex:none;border-right:none;border-bottom:1px solid var(--line)}
    .col-side{width:100%;flex:none}
    .detail{max-height:none;overflow:visible}
    #panelHandle{display:none}
  }
  @media(max-width:640px){
    /* шапка в колонку: бренд сверху, инструменты снизу, поиск на всю ширину */
    header{flex-direction:column;align-items:stretch;gap:10px;padding:10px 14px}
    .brand{padding-right:0}
    .brand h1{font-size:15px}
    .brand .eyebrow{font-size:9px;line-height:1.5;white-space:normal}
    .tools{width:100%}
    .search-wrap{flex:1 1 100%;order:-1}
    #search{width:100%}
    .results{width:100%;max-width:none}
    .legend{display:none}

    /* touch-цели крупнее — палец менее точен, чем курсор */
    .btn{padding:10px 13px;font-size:11px}
    .zoombar .btn{padding:10px 14px;font-size:15px}
    .navrow{padding:10px 20px 10px 17px}
    .chip{padding:7px 12px}
    .navrow .nm{max-width:56%}

    /* нижние плавающие элементы — не под системным индикатором дома на iPhone */
    .zoombar{bottom:calc(14px + env(safe-area-inset-bottom))}
    body{padding-bottom:env(safe-area-inset-bottom)}
  }
  @media(max-width:640px) and (pointer:coarse){
    /* iOS открывает свой зум страницы на инпутах с шрифтом мельче 16px — держим 16px везде на тач-экранах */
    input, textarea, select{font-size:16px!important}
  }
</style>

<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="eyebrow">WVWZZZAUZKP041455 · CZCA 1.4 TSI · DSG-7 DQ200 · 02.11.2018</div>
      <h1>Карта машины</h1>
    </div>
    <div class="tools">
      <div class="search-wrap">
        <input id="search" type="text" placeholder="Поиск: F38, свеча, 04E 115, ГБЦ, PR-код…" autocomplete="off">
        <div class="results" id="results"></div>
      </div>
      <button class="btn" id="btnFit">Вся карта</button>
      <button class="btn" id="btnClear">Сбросить</button>
    </div>
  </header>

  <main>
    <div class="col-graph">
      <svg id="gsvg"></svg>
      <div class="legend" id="legend"></div>
      <div class="zoombar">
        <button class="btn" id="zOut">−</button>
        <button class="btn" id="zIn">+</button>
      </div>
    </div>

    <div class="col-side" id="colSide">
      <div class="detail" id="detail"></div>
    </div>
    <button class="btn" id="panelHandle" title="Показать панель">‹</button>
  </main>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="golf_data.js"></script>
<script>

/* ============ индексы ============ */
const byId = new Map(GRAPH.nodes.map(n=>[n.id,n]));
const kids = new Map();
GRAPH.nodes.forEach(n=>{
  if(n.parent){ if(!kids.has(n.parent)) kids.set(n.parent,[]); kids.get(n.parent).push(n.id); }
});
const crossOf = new Map();
GRAPH.links.filter(l=>l.kind==='cross').forEach(l=>{
  if(!crossOf.has(l.source)) crossOf.set(l.source,[]);
  if(!crossOf.has(l.target)) crossOf.set(l.target,[]);
  crossOf.get(l.source).push({other:l.target,label:l.label});
  crossOf.get(l.target).push({other:l.source,label:l.label});
});
const crossLinks = GRAPH.links.filter(l=>l.kind==='cross');

function ancestors(id){ const out=[]; let n=byId.get(id); while(n&&n.parent){ out.push(n.parent); n=byId.get(n.parent);} return out; }
function descendants(id){ const out=[]; (function walk(i){ (kids.get(i)||[]).forEach(c=>{out.push(c); walk(c);}); })(id); return out; }

/* ============ геометрия узлов ============ */
const BOX = {
  root:        {w:200,h:56, fs:14,  lh:16, max:22},
  category:    {w:172,h:50, fs:12,  lh:14, max:20},
  engine_main: {w:172,h:50, fs:12,  lh:14, max:20},
  repair_group:{w:170,h:44, fs:10.5,lh:12.5,max:24},
  torque:      {w:170,h:46, fs:10,  lh:12, max:26},
  gap:         {w:170,h:46, fs:10,  lh:12, max:26},
  ecu:         {w:168,h:76, fs:9.5, lh:11, max:27},
  pr_bucket:   {w:150,h:46, fs:10,  lh:12, max:22},
  pr_code:     {w:46, h:28, fs:10,  lh:11, max:8},
  fuse:        {w:56, h:32, fs:10.5,lh:11, max:8},
  mod:         {w:172,h:50, fs:10.5,lh:12.5,max:24},
  part_bucket: {w:152,h:46, fs:10.5,lh:12.5,max:20},
  pr_list:     {w:172,h:50, fs:12,  lh:14,  max:20},
  part:        {w:150,h:38, fs:10,  lh:11.5,max:19},
  journal_item:{w:172,h:50, fs:10.5,lh:12.5,max:24},
  journal_bucket:{w:154,h:46, fs:10.5,lh:12.5,max:20},
  todo:        {w:164,h:44, fs:10,  lh:12,  max:23},
};
const COLS = {
  car:6, cat_engine:1, eng_czca:4, cat_ecu:3, cat_fuse:7, cat_pr:3, cat_mod:3,
  grp_00:1,grp_10:1,grp_13:1,grp_15:1,grp_17:1,grp_19:1,grp_21:1,grp_24:1,grp_26:1,grp_28:1,
  cat_parts:4, pb_lub:3, pb_air:3, pb_belt:2, pb_ign:3, pb_gen:3,
  pb_fuel:3, pb_turbo:2, pb_brake:3, pb_trans:2, pb_ecu:3,
  cat_journal:5, jr_consumables:3, jr_shop:6, jr_ext:4, jr_todo:4,
};
function colsFor(id,n){ return COLS[id] || (n>6 ? Math.ceil(Math.sqrt(n*1.5)) : n); }

const GAPX = 16, GAPY = 22, LEVEL = 46;

function wrap(text, max){
  const hard = text.split("\n");
  const out = [];
  hard.forEach(seg=>{
    const words = seg.split(/\s+/); let line = "";
    words.forEach(w=>{
      if(!line) line = w;
      else if((line+" "+w).length <= max) line += " "+w;
      else { out.push(line); line = w; }
    });
    if(line) out.push(line);
  });
  return out;
}

let collapsed = new Set();
const CATS = kids.get("car") || [];
const CATSET = new Set(CATS);
function resetCollapse(){
  collapsed = new Set();
  GRAPH.nodes.forEach(n=>{ if(kids.has(n.id) && n.id!=="car") collapsed.add(n.id); });
}
function collapseDeep(id){
  collapsed.add(id);
  descendants(id).forEach(x=>{ if(kids.has(x)) collapsed.add(x); });
}
/* аккордеон: раскрытие категории сворачивает остальные */
function toggleNode(id){
  if(!kids.has(id)) return false;
  if(collapsed.has(id)){
    if(CATSET.has(id)) CATS.forEach(c=>{ if(c!==id) collapseDeep(c); });
    collapsed.delete(id);
  } else collapseDeep(id);
  return true;
}
function ensureVisible(id){
  const anc = ancestors(id);
  const cat = CATSET.has(id) ? id : anc.find(a=>CATSET.has(a));
  let ch=false;
  if(cat) CATS.forEach(c=>{ if(c!==cat && !collapsed.has(c)){ collapseDeep(c); ch=true; } });
  anc.forEach(a=>{ if(collapsed.has(a)){ collapsed.delete(a); ch=true; } });
  if(CATSET.has(id) && collapsed.has(id)){ collapsed.delete(id); ch=true; }
  return ch;
}
resetCollapse();
function visKids(id){ return collapsed.has(id) ? [] : (kids.get(id)||[]); }

const pos = new Map();
const frames = [];

function packRows(boxes, targetRowW){
  const rows = []; let row = [], rowW = 0;
  boxes.forEach(b=>{
    const extra = row.length ? GAPX : 0;
    if(row.length && rowW + extra + b.w > targetRowW){
      rows.push(row); row = [b]; rowW = b.w;
    } else {
      row.push(b); rowW += extra + b.w;
    }
  });
  if(row.length) rows.push(row);
  return rows;
}

function measure(id){
  const n = byId.get(id), b = BOX[n.type];
  const lines = wrap(n.label, b.max);
  const selfH = Math.max(b.h, lines.length*b.lh + 16);
  const ch = visKids(id);
  if(!ch.length) return {id, lines, selfW:b.w, selfH, w:b.w, h:selfH, boxes:null};
  const boxes = ch.map(measure);
  // ширина строки — по медиане реальных ширин детей, а не по самому широкому:
  // так один раскрытый (разбухший) узел не диктует размер всей сетки, а просто
  // получает свою собственную, более длинную строку
  const colsHint = colsFor(id, boxes.length);
  const sortedW = boxes.map(x=>x.w).slice().sort((a,c)=>a-c);
  const medianW = sortedW[Math.floor(sortedW.length/2)];
  const targetRowW = Math.max(medianW, colsHint*(medianW+GAPX) - GAPX);
  const rows = packRows(boxes, boxes.length <= colsHint ? Infinity : targetRowW);
  let blockW = 0, blockH = 0;
  rows.forEach(row=>{
    const rowW = row.reduce((a,x)=>a+x.w,0) + GAPX*(row.length-1);
    blockW = Math.max(blockW, rowW);
    blockH += Math.max(...row.map(x=>x.h)) + GAPY;
  });
  blockH -= GAPY;
  return {id, lines, selfW:b.w, selfH, boxes, rows,
          w:Math.max(b.w+GAPX, blockW), h:selfH + LEVEL + blockH};
}

function place(box, cx, top){
  const n0 = byId.get(box.id);
  const ax = cx + ((n0 && n0.dx) || 0);
  const ay = top + ((n0 && n0.dy) || 0);
  pos.set(box.id, {x:ax, y:ay, w:box.selfW, h:box.selfH, lines:box.lines});
  if(!box.boxes) return;
  const blockTop = ay + box.selfH + LEVEL;
  let y = blockTop, minX = Infinity, maxX = -Infinity;
  box.rows.forEach(row=>{
    const rowH = Math.max(...row.map(b=>b.h));
    const rowW = row.reduce((a,x)=>a+x.w,0) + GAPX*(row.length-1);
    let x = ax - rowW/2;
    row.forEach(b=>{
      const c = x + b.w/2; place(b, c, y);
      const p = pos.get(b.id);
      minX = Math.min(minX, p.x-b.selfW/2); maxX = Math.max(maxX, p.x+b.selfW/2);
      x += b.w + GAPX;
    });
    y += rowH + GAPY;
  });
  if(box.id !== 'car')
    frames.push({id:box.id, x0:minX-12, y0:blockTop-12, x1:maxX+12, y1:y-GAPY+12});
}

let ROOTBOX = null;
function layout(){
  pos.clear(); frames.length = 0;
  ROOTBOX = measure("car");
  place(ROOTBOX, 0, 0);
}

/* ============ цвета ============ */
const BRANCH = {cat_engine:"blue", cat_ecu:"teal", cat_fuse:"amber", cat_pr:"violet", cat_mod:"coral", cat_parts:"green", cat_journal:"rose"};
const HEX = {blue:"#6ea8d8", teal:"#4fb0a5", amber:"#e8a33d", violet:"#b391d9", coral:"#e2735c", green:"#86bb5c", rose:"#d391a8", white:"#f0eee7", muted:"#6b6f76"};
const branchCache = new Map();
function branchOf(id){
  if(branchCache.has(id)) return branchCache.get(id);
  let n = byId.get(id), chain=[id];
  while(n && n.parent){ chain.push(n.parent); n = byId.get(n.parent); }
  const hit = chain.find(c=>BRANCH[c]);
  const v = hit ? BRANCH[hit] : "white";
  chain.forEach(c=>{ if(!branchCache.has(c)) branchCache.set(c, BRANCH[c] ? BRANCH[c] : v); });
  branchCache.set(id, v);
  return v;
}
const FUSE_TINT = {occ:"#4fb0a5", emp:"#e8a33d", none:"#4b4f57"};
function strokeOf(n){
  if(n.color) return n.color;
  if(n.type==='fuse') return FUSE_TINT[n.status] || HEX.amber;
  if(n.type==='todo') return HEX.muted;
  if(n.id==='car') return HEX.white;
  return HEX[branchOf(n.id)];
}
function fillOf(n){
  const c = strokeOf(n);
  const strong = ['root','category','engine_main','repair_group','mod','part_bucket','pr_list','journal_bucket'].includes(n.type);
  return strong ? hexA(c,0.15) : hexA(c, n.type==='todo' ? 0.04 : 0.07);
}
function hexA(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ============ отрисовка графа ============ */
const gsvg = d3.select("#gsvg");
const gRoot = gsvg.append("g");
const gFrames = gRoot.append("g").attr("class","lyr");
const gNodes  = gRoot.append("g");

const vw = ()=>gsvg.node().clientWidth, vh = ()=>gsvg.node().clientHeight;

let raf = 0;
const zoom = d3.zoom().scaleExtent([0.08,3]).on("zoom", e=>{
  gRoot.attr("transform", e.transform);            // мгновенно, без перестроения DOM
  if(!raf) raf = requestAnimationFrame(()=>{ raf=0; render(); });
});
gsvg.call(zoom);

function elbow(p,c){
  const y0=p.y+p.h, y1=c.y, mid=y0+(y1-y0)*0.5;
  return `M${p.x},${y0} L${p.x},${mid} L${c.x},${mid} L${c.x},${y1}`;
}
function stalk(p,f){ return `M${p.x},${p.y+p.h} L${p.x},${f.y0}`; }
function curveX(a,b){
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2+Math.abs(a.x-b.x)*0.10+30;
  return `M${a.x},${a.y+a.h/2} Q${mx},${my} ${b.x},${b.y+b.h/2}`;
}

/* --- статика: считается один раз, дальше только фильтруется --- */
let FRAMEBOX=[], NODEBOX=[];

function buildStatics(){
  layout();
  FRAMEBOX = frames.slice();
  NODEBOX = GRAPH.nodes.filter(n=>pos.has(n.id)).map(n=>{
    const p=pos.get(n.id);
    return {id:n.id, n, x0:p.x-p.w/2, x1:p.x+p.w/2, y0:p.y, y1:p.y+p.h};
  });
}

/* --- отсечение по видимой области --- */
const TEXT_MIN = 0.40;
let VR = {x0:0,y0:0,x1:0,y1:0}, curK = 1;
function computeView(){
  const t = d3.zoomTransform(gsvg.node());
  curK = t.k;
  const w=vw(), h=vh(), mx=w*0.30/t.k, my=h*0.30/t.k;
  VR = {x0:(-t.x)/t.k-mx, y0:(-t.y)/t.k-my, x1:(w-t.x)/t.k+mx, y1:(h-t.y)/t.k+my};
}
function hit(o){ return o.x1>=VR.x0 && o.x0<=VR.x1 && o.y1>=VR.y0 && o.y0<=VR.y1; }

const SVGNS = "http://www.w3.org/2000/svg";
function addText(d){
  if(this.__txt) return;
  const p=pos.get(d.id), b=BOX[d.n.type];
  const total=p.lines.length*b.lh, y0=p.h/2-total/2+b.lh*0.78;
  const light=['pr_code','fuse','torque','part','todo','journal_item'].includes(d.n.type);
  for(let i=0;i<p.lines.length;i++){
    const t=document.createElementNS(SVGNS,"text");
    t.setAttribute("y", y0+i*b.lh); t.setAttribute("text-anchor","middle");
    t.setAttribute("font-size", b.fs); t.setAttribute("fill", light?"#cfccc4":"#e9e7e0");
    t.textContent=p.lines[i]; this.appendChild(t);
  }
  if(collapsed.has(d.id)){
    const bd=document.createElementNS(SVGNS,"text");
    bd.setAttribute("x", p.w/2-9); bd.setAttribute("y", p.h-6);
    bd.setAttribute("text-anchor","end"); bd.setAttribute("font-size",9);
    bd.setAttribute("fill", strokeOf(d.n));
    bd.textContent = "+"+(kids.get(d.id)||[]).length; this.appendChild(bd);
  }
  this.__txt = true;
}

// Свободно двигать можно только «крупные» узлы верхнего уровня: сам автомобиль
// и его 7 прямых разделов. Всё, что глубже, двигать нельзя — так проще
// ориентироваться, когда карту открывают просто посмотреть.
const DRAGGABLE_IDS = new Set(["car", ...CATS]);

const DRAG_THRESHOLD_PX = 6;       // мышь: сколько экранных пикселей до перетаскивания
const DRAG_THRESHOLD_TOUCH_PX = 12; // палец менее точен — порог выше, чтобы обычный тап не улетал в drag

let dragMoved = false;
const nodeDrag = d3.drag()
  .on("start", function(e,d){
    if(!DRAGGABLE_IDS.has(d.id)) return;
    dragMoved = false;
    const p = pos.get(d.id);
    const isTouch = e.sourceEvent && (e.sourceEvent.pointerType === "touch" || e.sourceEvent.type === "touchstart");
    this.__grab = { ox: p.x - e.x, oy: p.y - e.y, sx: e.x, sy: e.y, armed:false, isTouch };
  })
  .on("drag", function(e,d){
    if(!DRAGGABLE_IDS.has(d.id)) return;
    const g = this.__grab;
    if(!g.armed){
      const k = d3.zoomTransform(gsvg.node()).k;
      const dxw = e.x - g.sx, dyw = e.y - g.sy;
      const distPx = Math.sqrt(dxw*dxw + dyw*dyw) * k;
      const threshold = g.isTouch ? DRAG_THRESHOLD_TOUCH_PX : DRAG_THRESHOLD_PX;
      if(distPx < threshold) return; // ещё в пределах дрожания клика/тапа — не двигаем узел
      g.armed = true;
      d3.select(this).raise();
    }
    dragMoved = true;
    const nx = e.x + g.ox, ny = e.y + g.oy;
    this.__liveX = nx; this.__liveY = ny;
    d3.select(this).attr("transform", `translate(${nx},${ny})`);
  })
  .on("end", function(e,d){
    if(!DRAGGABLE_IDS.has(d.id) || !dragMoved) return;
    const p = pos.get(d.id);
    const baseX = p.x - (d.n.dx||0), baseY = p.y - (d.n.dy||0);
    d.n.dx = this.__liveX - baseX;
    d.n.dy = this.__liveY - baseY;
    draw();
  });

function render(){
  computeView();

  const fs = gFrames.selectAll("rect").data(FRAMEBOX.filter(hit), d=>d.id);
  fs.exit().remove();
  fs.enter().append("rect").attr("class","gframe").attr("rx",9)
    .attr("x",d=>d.x0).attr("y",d=>d.y0)
    .attr("width",d=>d.x1-d.x0).attr("height",d=>d.y1-d.y0);

  const ns = gNodes.selectAll("g.gnode").data(NODEBOX.filter(hit), d=>d.id);
  ns.exit().remove();
  const en = ns.enter().append("g")
    .attr("class",d=>"gnode t-"+d.n.type + (DRAGGABLE_IDS.has(d.id)?" draggable":""))
    .attr("transform",d=>{ const p=pos.get(d.id); return `translate(${p.x},${p.y})`; })
    .call(nodeDrag)
    .on("click",(e,d)=>{
      e.stopPropagation();
      if(dragMoved){ dragMoved=false; return; }
      onNodeClick(d.id);
    });
  en.append("rect").attr("rx",6)
    .attr("x",d=>-pos.get(d.id).w/2).attr("y",0)
    .attr("width",d=>pos.get(d.id).w).attr("height",d=>pos.get(d.id).h)
    .attr("fill",d=>fillOf(d.n)).attr("stroke",d=>strokeOf(d.n))
    .attr("stroke-dasharray",d=> (d.n.type==='part' && d.n.verified===false) || d.n.type==='todo' ? "3,2.5" : null);

  const all = en.merge(ns);
  if(curK >= TEXT_MIN) all.each(addText);
  if(hlNodes.size || matched.size || selectedId) applyHighlight();
}

function draw(){
  buildStatics();
  gNodes.selectAll("g.gnode").remove();
  gFrames.selectAll("rect").remove();
  render();
}

/* ============ подсветка ============ */
let selectedId = null, hlNodes = new Set(), matched = new Set();

function computeHighlight(id){
  const s = new Set([id]);
  ancestors(id).forEach(a=>s.add(a));
  descendants(id).forEach(a=>s.add(a));
  (crossOf.get(id)||[]).forEach(c=>{ s.add(c.other); ancestors(c.other).forEach(a=>s.add(a)); });
  return s;
}
function applyHighlight(){
  const active = hlNodes.size>0 || matched.size>0;
  const live = matched.size>0 ? matched : hlNodes;
  gNodes.selectAll("g.gnode")
    .classed("faded", d=> active && !live.has(d.id))
    .classed("sel",   d=> d.id===selectedId);
  gFrames.selectAll("rect").classed("faded", d=> active && !live.has(d.id));
}

function frameOnSubtree(id, dur){
  const idsIn = [id, ...descendants(id)].filter(x=>pos.has(x));
  const b = {x0:Infinity,y0:Infinity,x1:-Infinity,y1:-Infinity};
  idsIn.forEach(i=>{ const p=pos.get(i);
    b.x0=Math.min(b.x0,p.x-p.w/2); b.x1=Math.max(b.x1,p.x+p.w/2);
    b.y0=Math.min(b.y0,p.y); b.y1=Math.max(b.y1,p.y+p.h); });
  if(!isFinite(b.x0)) return;
  const W=b.x1-b.x0, H=b.y1-b.y0;
  let k = Math.min(vw()/(W+130), vh()/(H+130));
  k = Math.min(k, 1.3); k = Math.max(k, 0.1);
  const t = d3.zoomIdentity.translate(vw()/2-((b.x0+b.x1)/2)*k, vh()/2-((b.y0+b.y1)/2)*k).scale(k);
  gsvg.transition().duration(dur||380).call(zoom.transform, t);
}
function anchorNode(id, oldScreen, dur){
  const p = pos.get(id);
  if(!p || !oldScreen) return;
  const t = d3.zoomTransform(gsvg.node());
  const cx = p.x, cy = p.y + p.h/2;
  const nt = d3.zoomIdentity.translate(oldScreen.x - cx*t.k, oldScreen.y - cy*t.k).scale(t.k);
  gsvg.transition().duration(dur||300).call(zoom.transform, nt);
}
function toggleAndFrame(id, isClick){
  const t0 = d3.zoomTransform(gsvg.node());
  const oldPos = pos.get(id);
  const oldScreen = oldPos ? {x:t0.x+oldPos.x*t0.k, y:t0.y+(oldPos.y+oldPos.h/2)*t0.k} : null;
  const wasCollapsed = collapsed.has(id);
  const changed = toggleNode(id);
  if(changed){
    draw();
    if(wasCollapsed) frameOnSubtree(id, 380);
    else if(oldScreen) anchorNode(id, oldScreen, 300);
  } else if(isClick){
    applyHighlight();
  }
  return changed;
}
function onNodeClick(id){
  selectedId = id; matched = new Set();
  hlNodes = computeHighlight(id);
  toggleAndFrame(id, true);
  showNode(id);
}
function selectNode(id, noPan){
  const changed = ensureVisible(id);
  selectedId = id; matched = new Set();
  hlNodes = computeHighlight(id);
  if(changed) draw(); else applyHighlight();
  showNode(id);
  if(noPan) return;
  const p = pos.get(id);
  if(p){
    const k = Math.max(0.95, d3.zoomTransform(gsvg.node()).k);
    gsvg.transition().duration(450).call(zoom.transform,
      d3.zoomIdentity.translate(vw()/2 - p.x*k, vh()/2 - p.y*k).scale(k));
  }
}
function clearSel(){
  selectedId=null; hlNodes=new Set(); matched=new Set();
  applyHighlight(); showIntro();
}
gsvg.on("click", clearSel);

/* ============ панель деталей ============ */
const TYPE_RU = {root:"Автомобиль",category:"Раздел",engine_main:"Двигатель",repair_group:"Группа ремонта",
  torque:"Момент затяжки",gap:"Пробел в данных",ecu:"Блок управления",pr_bucket:"Категория опций",
  pr_code:"PR-код",fuse:"Предохранитель",mod:"Твоя доработка",
  part:"Деталь по каталогу",part_bucket:"Группа деталей",pr_list:"Комплектация по VIN",
  journal_item:"Запись в журнале",journal_bucket:"Раздел журнала",todo:"В планах — не сделано"};

function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function flat(t){ return esc(String(t).replace(/\n/g," ")); }

// краткая вторая строка для списка «внутри»
function subOf(n){
  const m = n.meta || {};
  switch(n.type){
    case 'pr_code':  return m["Значение"] || "";
    case 'fuse':     return [m["Функция"], m["Номинал"]].filter(Boolean).join(" · ");
    case 'ecu':      return m["Номер детали"] || "";
    case 'torque':   return m["Момент затяжки / примечание"] || "";
    case 'repair_group': return m["Что внутри"] || "";
    case 'mod':      return m["Что сделано"] || "";
    case 'engine_main': return m["Мощность"] || "";
    case 'gap':      return m["Статус"] || m["Что не так"] || "";
    case 'part':     return n.meta["Артикул"] || "";
    case 'part_bucket': return (kids.get(n.id)||[]).length + " артикулов";
    case 'pr_list':  return "полный список с фильтром";
    case 'journal_item': {
      const keys = Object.keys(m).filter(k=>k!=="Статус");
      return keys.length ? (m[keys[0]] || "") : (m["Статус"]||"");
    }
    case 'journal_bucket': {
      const tot = m["Итого"] || m["Итого по разделу"] || m["Итого по покупкам"];
      const cnt = (kids.get(n.id)||[]).length;
      return tot ? `${cnt} · ${tot}` : cnt + " записей";
    }
    case 'todo': return m["Оценка"] ? "≈ "+m["Оценка"] : "в планах";
    default: {
      const k = kids.get(n.id) || [];
      return k.length ? k.length + " внутри" : "";
    }
  }
}
function cut(t, n){ t = String(t); return t.length > n ? t.slice(0, n-1) + "…" : t; }

function crumbHTML(id){
  const chain = [id, ...ancestors(id)].reverse();
  return `<div class="crumbs">` + chain.map((c,i)=>{
    const last = i === chain.length-1;
    return `<span class="crumb${last?" here":""}" data-go="${c}">${flat(byId.get(c).label)}</span>`
         + (last ? "" : `<span class="crumb-sep">/</span>`);
  }).join("") + `</div>`;
}

function showNode(id){
  const n = byId.get(id), el = document.getElementById("detail");
  const ch = kids.get(id) || [];
  const cr = crossOf.get(id) || [];

  let h = crumbHTML(id);
  h += `<div class="ptype">${TYPE_RU[n.type]||n.type}</div><h2>${flat(n.label)}</h2>`;

  Object.entries(n.meta||{}).forEach(([k,v])=>{
    if(!v) return;
    const warn = (k==="Достоверность" && n.verified===false);
    h += `<div class="field"><div class="k">${esc(k)}</div>`
       + `<div class="v"${warn?' style="color:#e8a33d"':''}>${esc(v)}</div></div>`;
  });

  // ---- папочная навигация ----
  h += `<div class="navsec"><div class="lt"><span>Внутри${ch.length?" · "+ch.length:""}</span>`;
  if(ch.length) h += `<span class="tg" data-toggle="${id}">${collapsed.has(id)?"раскрыть в графе":"свернуть в графе"}</span>`;
  h += `</div><div class="navlist">`;

  if(n.parent){
    h += `<div class="navrow up" data-go="${n.parent}"><span class="nm">← ${flat(byId.get(n.parent).label)}</span></div>`;
  }
  if(ch.length){
    ch.forEach(cid=>{
      const c = byId.get(cid);
      const grand = (kids.get(cid)||[]).length;
      const sub = cut(subOf(c), 70);
      h += `<div class="navrow" data-go="${cid}">`
         + `<span class="navdot" style="background:${strokeOf(c)}"></span>`
         + `<span class="nm">${flat(c.label)}</span>`
         + `<span class="ns">${esc(sub)}</span>`
         + `<span class="nk">${grand ? "▸ "+grand : ""}</span></div>`;
    });
  } else {
    h += `<div class="navrow up" style="cursor:default;border-left-color:transparent">
            <span class="nm" style="color:var(--dimmer)">— конечный элемент —</span></div>`;
  }
  h += `</div></div>`;

  // ---- полный список PR-кодов ----
  if(n.type==='pr_list'){
    h += `<div class="navsec"><div class="lt"><span>Все коды комплектации</span></div>
      <input id="prfilter" type="text" placeholder="фильтр: код или слово из описания…" autocomplete="off">
      <div class="prcount" id="prcount"></div><div id="prbody"></div></div>`;
  }

  // ---- ссылки по артикулу ----
  if(n.type==='part' && n.art){
    h += `<div class="navsec"><div class="lt"><span>Артикул ${esc(n.meta["Артикул"])}</span></div>`
       + `<a class="chip" href="https://exist.ru/Price/?pcode=${encodeURIComponent(n.art)}" target="_blank" rel="noopener">Exist ↗</a>`
       + `<span class="chip" data-copy="${esc(n.art)}">Копировать артикул</span>`
       + `<a class="chip" href="https://www.google.com/search?q=${encodeURIComponent(n.art)}" target="_blank" rel="noopener">Аналоги в поиске ↗</a>`
       + `</div>`;
  }

  // ---- связи между разделами ----
  if(cr.length){
    h += `<div class="navsec"><div class="lt"><span>Связано с · ${cr.length}</span></div><div class="navlist">`;
    cr.forEach(c=>{
      const o = byId.get(c.other);
      h += `<div class="navrow" data-go="${c.other}">`
         + `<span class="navdot" style="background:${strokeOf(o)}"></span>`
         + `<span class="nm">${flat(o.label)}</span>`
         + `<span class="ns">${esc(cut(subOf(o),60))}</span>`
         + `<span class="nk">${c.label?esc(c.label):""}</span></div>`;
    });
    h += `</div></div>`;
  }

  el.innerHTML = h;
  el.querySelectorAll("[data-go]").forEach(c=>c.onclick=e=>{ e.stopPropagation(); selectNode(c.dataset.go,false); });
  if(n.type==='pr_list') initPrList();
  el.querySelectorAll("[data-copy]").forEach(c=>c.onclick=e=>{
    e.stopPropagation();
    navigator.clipboard.writeText(c.dataset.copy).then(()=>{
      const o=c.textContent; c.textContent="скопировано"; setTimeout(()=>c.textContent=o,1200);
    }).catch(()=>{});
  });
  el.querySelectorAll("[data-toggle]").forEach(c=>c.onclick=e=>{
    e.stopPropagation();
    const t = c.dataset.toggle;
    toggleAndFrame(t, false);
    showNode(t);
  });

  el.scrollTop = 0;
  scrollPanelIntoViewOnMobile();
}

function scrollPanelIntoViewOnMobile(){
  if(!window.matchMedia || !window.matchMedia("(max-width:1100px)").matches) return;
  const cs = document.getElementById("colSide");
  if(cs && typeof cs.scrollIntoView === "function"){
    try{ cs.scrollIntoView({behavior:"smooth", block:"start"}); }catch(e){}
  }
}

function renderPr(q){
  q = (q||"").trim().toLowerCase();
  const body = document.getElementById("prbody");
  const cnt  = document.getElementById("prcount");
  if(!body) return;
  let html = "", shown = 0;
  (GRAPH.pr||[]).forEach(g=>{
    const rows = g.items.filter(it=>
      !q || it[0].toLowerCase().includes(q) || (it[1]+" "+it[2]).toLowerCase().includes(q));
    if(!rows.length) return;
    html += `<div class="prgroup">${esc(g.g)}</div>`;
    rows.forEach(it=>{
      shown++;
      html += `<div class="prrow"><span class="pc">${esc(it[0])}</span>`
           +  `<span class="pv">${esc(it[2])}<span class="pp">${esc(it[1])}</span></span></div>`;
    });
  });
  body.innerHTML = html || `<div class="empty">Ничего не найдено.</div>`;
  const total = (GRAPH.pr||[]).reduce((a,g)=>a+g.items.length,0);
  cnt.textContent = q ? `найдено ${shown} из ${total}` : `${total} кодов`;
}
function initPrList(){
  const f = document.getElementById("prfilter");
  if(f) f.oninput = ()=>renderPr(f.value);
  renderPr("");
}

function showIntro(){
  const el = document.getElementById("detail");
  let h = `<div class="ptype">Начало</div><h2>Golf 7.5 · 2019</h2>
    <div class="empty">Клик по разделу раскрывает его и сворачивает остальные — на экране всегда только то, что смотришь.
    Повторный клик сворачивает обратно.<br><br>
    Список ниже работает как обычные папки: можно ходить по машине, не трогая граф.</div>`;
  h += `<div class="navsec"><div class="lt"><span>Разделы</span></div><div class="navlist">`;
  (kids.get("car")||[]).forEach(cid=>{
    const c = byId.get(cid), grand = (kids.get(cid)||[]).length;
    h += `<div class="navrow" data-go="${cid}">`
       + `<span class="navdot" style="background:${strokeOf(c)}"></span>`
       + `<span class="nm">${flat(c.label)}</span>`
       + `<span class="ns">${esc(cut(subOf(c),60))}</span>`
       + `<span class="nk">${grand?"▸ "+grand:""}</span></div>`;
  });
  h += `<div class="navrow" data-go="car"><span class="navdot" style="background:#f0eee7"></span>
        <span class="nm">Паспорт машины</span><span class="ns">VIN, двигатель, КП, цвет</span><span class="nk"></span></div>`;
  h += `</div></div>`;
  el.innerHTML = h;
  el.querySelectorAll("[data-go]").forEach(c=>c.onclick=e=>{ e.stopPropagation(); selectNode(c.dataset.go,false); });
  el.scrollTop = 0;
}

/* ============ поиск ============ */
const si = document.getElementById("search"), rs = document.getElementById("results");
si.addEventListener("input", ()=>{
  const q = si.value.trim().toLowerCase();
  if(q.length<2){ rs.classList.remove("show"); matched=new Set(); applyHighlight(); return; }
  const hits = GRAPH.nodes.filter(n=>{
    const hay = [n.id, n.label, ...Object.values(n.meta||{})].join(" ").toLowerCase();
    return hay.includes(q);
  }).slice(0,40);
  matched = new Set(); hits.forEach(h=>{ matched.add(h.id); ancestors(h.id).forEach(a=>matched.add(a)); });
  applyHighlight();
  rs.innerHTML = "";
  hits.slice(0,25).forEach(h=>{
    const d = document.createElement("div"); d.className="ritem";
    d.innerHTML = `<span>${h.label.replace(/\n/g," ")}</span><span class="rd">${TYPE_RU[h.type]||h.type}</span>`;
    d.onclick = ()=>{ rs.classList.remove("show"); si.value=""; matched=new Set(); selectNode(h.id,false); };
    rs.appendChild(d);
  });
  rs.classList.toggle("show", hits.length>0);
});
document.addEventListener("click",e=>{ if(!e.target.closest(".search-wrap")) rs.classList.remove("show"); });

/* ============ управление ============ */
function fitAll(dur, maxK){
  const b = {x0:Infinity,y0:Infinity,x1:-Infinity,y1:-Infinity};
  pos.forEach(p=>{ b.x0=Math.min(b.x0,p.x-p.w/2); b.x1=Math.max(b.x1,p.x+p.w/2);
                   b.y0=Math.min(b.y0,p.y); b.y1=Math.max(b.y1,p.y+p.h); });
  if(!isFinite(b.x0)) return;
  const W=b.x1-b.x0, H=b.y1-b.y0;
  let k = Math.min(vw()/(W+100), vh()/(H+100));
  if(maxK) k = Math.min(k, maxK);
  const t = d3.zoomIdentity.translate(vw()/2-((b.x0+b.x1)/2)*k, vh()/2-((b.y0+b.y1)/2)*k).scale(k);
  if(dur) gsvg.transition().duration(dur).call(zoom.transform, t);
  else gsvg.call(zoom.transform, t);
}
function startView(){ fitAll(0, 1.15); }
document.getElementById("btnFit").onclick = ()=>fitAll(500, 1.15);
document.getElementById("btnClear").onclick = ()=>{ si.value=""; resetCollapse(); clearSel(); draw(); startView(); };

  const isCollapsed = colSide.classList.toggle("collapsed");

  panelHandle.title = isCollapsed ? "Показать панель" : "Скрыть панель";
};
colSide.addEventListener("transitionend", e=>{
  if(e.propertyName==="width" && !raf) raf = requestAnimationFrame(()=>{ raf=0; render(); });
});
document.getElementById("zIn").onclick = ()=>gsvg.transition().duration(200).call(zoom.scaleBy,1.35);
document.getElementById("zOut").onclick = ()=>gsvg.transition().duration(200).call(zoom.scaleBy,1/1.35);
